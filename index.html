<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Favicons (desktop browsers: Chrome, Firefox, Safari, Edge) -->

    <!-- iOS / Safari home screen (Add to Home Screen) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Japón 2026" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4d1c1e" />

    <!-- Link preview when shared on WhatsApp / iMessage / etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Viaje a Japón 2026 🇯🇵" />
    <meta property="og:description" content="Guía del viaje: itinerario día a día, vuelos, alojamientos y presupuesto." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Viaje a Japón 2026 🇯🇵" />
    <meta name="twitter:image" content="https://viaje-japon-sept-2026.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        function showFatalError(title, msg) {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.innerText.trim() === '')) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper, #f7f4ed);">' +
              '<div style="max-width:440px;width:100%;background:#ffffff;border:1px solid #e0d7cb;border-radius:24px;padding:28px 24px;box-shadow:0 12px 36px rgba(0,0,0,0.08);text-align:center;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;">' +
                '<div style="width:52px;height:52px;border-radius:50%;background:#bc474918;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;">🇯🇵</div>' +
                '<h2 style="font-size:18px;font-weight:700;color:#1d3557;margin:0 0 8px;">' + (title || 'Error al cargar la aplicación') + '</h2>' +
                '<p style="font-size:13px;color:#666;line-height:1.5;margin:0 0 20px;">' + (msg || 'Se ha producido un error inesperado al iniciar los componentes.') + '</p>' +
                '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
                  '<button onclick="location.reload()" style="padding:10px 18px;background:#bc4749;color:#fff;border:none;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;">Recargar página</button>' +
                  '<button onclick="localStorage.clear();sessionStorage.clear();location.reload(true);" style="padding:10px 18px;background:#1d3557;color:#fff;border:none;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;">Limpiar caché</button>' +
                '</div>' +
              '</div>' +
            '</div>';
          }
        }
        window.addEventListener('error', function(e) {
          console.error('Global Error caught:', e);
          showFatalError('Error al iniciar la web', e.message);
        });
        window.addEventListener('unhandledrejection', function(e) {
          console.error('Unhandled Promise Rejection:', e);
          var reason = e.reason ? (e.reason.message || String(e.reason)) : 'Fallo en una petición asíncrona.';
          showFatalError('Error de conexión o datos', reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
